name: "PR Needs Rebase"

on:
  push:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  label-rebase-needed:
    # do not run on PRs in forks
    if: github.repository == 'mdn/translated-content'
    uses: mdn/workflows/.github/workflows/pr-rebase-needed.yml@5c0fe55eace1852dc2a10875c3a399750f5e72be  # main
    with:
      target-repo: "mdn/translated-content"
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
